},{"elements":[{"element_type":0,"text_element":{"text":"同上，图生图的skill我也帮大家做好了。只要上传参考图片和人物小传，它就会问你这些图要怎么分配，然后自动融合成一张新图【录屏截图】","text_style":{}}}],"indent":0,"list_begin_index":0,"paragraph_type":0,"quote":false},{"elements":[],"indent":0,"list_begin_index":0,"paragraph_type":0,"quote":false}]},"text":"不过话又说回来，就算咱们给这个AI再多的信息，它生成出来的人物还是会随机，因为文字太抽象，不够具体。【多张人脸慢慢移动】如果你不想让他这么发散的话，\n那你这个时候就可以用到图生图了。\n这里我推荐4个国内外找图比较好的网站【目录图】\n不过找图也需要两个技巧，\n技巧1，要跟AI说提取参考图的面貌特征、整体风格，而不是直接照抄这张图。【一张图片扫描扫光】要不然AI大概率会偷懒，给你生成个一模一样【三图对比】\n技巧二，要多图融成一张图。分两大部分，一个是融脸，一个是融身。融脸你要选多张图片，【两张图】然后只让AI提取他们各自的局部五官【局部五官清晰整体模糊+图片放大】，比如提取图片1的眉眼，图片2的鼻子嘴巴【对应出文字+黑白色底板】。然后合成一个新的五官。融身的话，那就分别让AI参考发型和衣着。这样融出来既比较可控，又是一个新的人物【结果展示】\n你还可以女生脸转男生、漫画脸转真人。算是现在做人物资产最常见的形式了\n当然，文生图和图生图也不用分得那么开，你既可以去完善人物的小传的基础上，再加上多张图片，生出来的人物会更符合你的要求（我全都要）\n同上，图生图的skill我也帮大家做好了。只要上传参考图片和人物小传，它就会问你这些图要怎么分配，然后自动融合成一张新图【录屏截图】\n","text_background_color_type":0,"text_color":"#1f2329","text_color_type":0,"theme_text_background_color_code":-1,"theme_text_color_code":-1,"underline":false,"vertical_align":"top"},"type":"text_shape","width":420.0000305175781,"x":1557.156494140625,"y":947.27734375,"z_index":94},{"angle":0,"height":139.18800354003906,"id":"d5:28","image":{"token":"Ehsrbzk67oGlxPx3QUmc1ak5n0b"},"locked":false,"parent_id":"z5:91","style":{"border_style":"none","h_flip":false,"v_flip":false},"text":{"angle":0,"font_size":14,"font_weight":"regular","horizontal_align":"center","italic":false,"line_through":false,"text":"","text_background_color_type":0,"text_color":"#1f2329","text_color_type":0,"theme_text_background_color_code":-1,"theme_text_color_code":-1,"underline":false,"vertical_align":"mid"},"type":"image","width":278.3760070800781,"x":8,"y":32.27199935913086,"z_index":0},{"angle":0,"height":143.56422424316406,"id":"d5:46","image":{"token":"ETaPbYY05otkLyx8vhEctGuZn2a"},"locked":false,"parent_id":"z5:102","style":{"border_style":"none","h_flip":false,"v_flip":false},"text":{"angle":0,"font_size":14,"font_weight":"regular","horizontal_align":"c tapnow的人物资产提示词规范。【电脑截图+划色块】加上以后生出来的质感、灯光、细腻程度都会有质的变化【两张图对比+底部划色块】【一张图片往右位移出画面】\n（技巧五）如果你想GPT改图，切记不要在原图的基础上去改，因为你每在老图上改一次，AI就会往上叠加一次算法。条纹噪点油腻感就会更加严重，这个当前无解。所以要让AI重新生成一段新的提示词。【截图划色块】然后你用新的提示词去重新生成新图。【两图对比】","text_background_color_type":0,"text_color":"#1f2329","text_color_type":0,"theme_text_background_color_code":-1,"theme_text_color_code":-1,"underline":false,"vertical_align":"top"},"type":"text_shape","width":420,"x":1712.3680419921875,"y":-1170.8853759765625,"z_index":91},{"angle":0,"height":150.81446838378906,"id":"d5:67","image":{"token":"PU2ZbRaBqoILAax4kaJcvWdNntd"},"locked":false,"parent_id":"z5:113","style":{"border_style":"none","h_flip":false,"v_flip":false},"text":{"angle":0,"font_size":14,"font_weight":"regular","horizontal_align":"center","italic":false,"line_through":false,"text":"","text_background_color_type":0,"text_color":"#1f2329","text_color_type":0,"theme_text_background_color_code":-1,"theme_text_color_code":-1,"underline":false,"vertical_align":"mid"},"type":"image","width":113.11085510253906,"x":8,"y":32.27199935913086,"z_index":0},{"angle":0,"height":228.91795349121094,"id":"d5:60","image":{"token":"BhcobzWtZoThVRxVvJscmp9yn2d"},"locked":false,"parent_id":"z5:109","style":{"border_style":"none","h_flip":false,"v_flip":false},"text":{"angle":0,"font_size":14,"font_weight":"regular","horizontal_align":"center","italic":false,"line_through":false,"text":"","text_background_color_type":0,"text_color":"#1f2329","text_color_type":0,"theme_text_background_color_code":-1,"theme_text_color_code":-1,"underline":false,"vertical_align":"mid"},"type":"image","width":171.68846130371094,"x":8,"y":32.27199935913086,"z_index":0},{"angle":0,"height":76.2766342163086,"id":"d5:11","image":{"token":"AGlNbwp9bo6UlxxBocXcmqjSnfc"},"locked":false,"parent_id":"z5:88","style":{"border_style":"none","h_flip":false,"v_flip":false},"text":{"angle":0,"font_size":14,"font_weight":"regular","horizontal_align":"center","italic":false,"line_through":false,"text":"","text_bac
